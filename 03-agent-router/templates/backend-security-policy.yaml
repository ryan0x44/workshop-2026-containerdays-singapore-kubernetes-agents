# configures upstream authentication using the API key Secret
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: {{ .Release.Name }}
{{- if eq .Values.schema "Anthropic" }}
  type: AnthropicAPIKey
  anthropicAPIKey:
{{- else }}
  type: APIKey
  apiKey:
{{- end }}
    secretRef:
      name: inference-provider-api-key
