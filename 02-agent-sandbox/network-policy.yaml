apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi
  namespace: workshop
spec:
  podSelector:
    matchLabels:
      app: workshop-pi
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # Local inference on the laptop: host.podplane.internal resolves to QEMU's host IP.
    - to:
        - ipBlock:
            cidr: 10.0.2.2/32
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-coredns
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-agent-router
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: platform-agent-router-gateway
      ports:
        # Envoy's port-443 Service targets its unprivileged listener on 10443.
        - protocol: TCP
          port: 10443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-sourcegateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sourcegateway
      ports:
        - protocol: TCP
          port: 8443
